name: Publish to MCP Registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (defaults to package.json version)"
        required: false
        type: string

jobs:
  publish-mcp:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication with MCP Registry
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            # Remove 'v' prefix if it exists
            VERSION="${VERSION#v}"
          else
            VERSION=$(node -p "require('./packages/mcp/package.json').version")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Publishing version: $VERSION"

      - name: Update package version in server.json
        run: |
          echo $(jq --arg v "${{ env.VERSION }}" '.version = $v | .packages[0].version = $v' server.json) > server.json

      - name: Validate server.json
        run: npx mcp-registry-validator validate server.json

      - name: Install MCP Publisher
        run: |
          OS_NAME=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH_NAME=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          PUBLISHER_TARBALL="mcp-publisher_${OS_NAME}_${ARCH_NAME}.tar.gz"
          curl -L -o "$PUBLISHER_TARBALL" "https://github.com/modelcontextprotocol/registry/releases/download/v1.4.0/${PUBLISHER_TARBALL}"
          curl -L -o registry_checksums.txt "https://github.com/modelcontextprotocol/registry/releases/download/v1.4.0/registry_1.4.0_checksums.txt"
          grep " ${PUBLISHER_TARBALL}$" registry_checksums.txt | sha256sum -c -
          tar xz "${PUBLISHER_TARBALL}" mcp-publisher

      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
